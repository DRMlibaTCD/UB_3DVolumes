        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        .tv-root {
          --mono: 'IBM Plex Mono', ui-monospace, monospace;
          --sans: 'Space Grotesk', ui-sans-serif, sans-serif;

          position: relative;
          background: var(--bg);
          color: var(--text);
          font-family: var(--sans);
          border-radius: 14px;
          padding: 22px;
          width: 100%;
          box-sizing: border-box;
          transition: background 0.2s ease, color 0.2s ease;
        }
        .tv-root * { box-sizing: border-box; }

        .tv-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 16px;
          padding-bottom: 16px;
          margin-bottom: 18px;
          border-bottom: 1px solid var(--border);
          flex-wrap: wrap;
        }
        .tv-header-actions {
          display: flex;
          gap: 6px;
          flex-shrink: 0;
        }
        .tv-icon-btn {
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          width: 32px;
          height: 32px;
          border-radius: 7px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-icon-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tv-theme-toggle {
          display: flex;
          align-items: center;
          gap: 6px;
          background: var(--accent-dim);
          border: 1px solid var(--accent);
          color: var(--accent);
          font-family: var(--mono);
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          padding: 0 12px;
          height: 32px;
          border-radius: 16px;
          cursor: pointer;
          transition: filter 0.15s ease;
        }
        .tv-theme-toggle:hover { filter: brightness(1.1); }
        .tv-wordmark {
          font-family: var(--mono);
          font-size: 22px;
          letter-spacing: 0.02em;
          font-weight: 600;
        }
        .tv-wordmark span { color: var(--accent); }
        .tv-byline {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.04em;
          color: var(--text-dim);
          margin-top: 2px;
        }
        .tv-tagline {
          font-size: 12.5px;
          color: var(--text-dim);
          max-width: 420px;
          line-height: 1.5;
          margin-top: 8px;
        }

        .tv-grid {
          display: grid;
          grid-template-columns: 260px 1fr 260px;
          gap: 16px;
          align-items: start;
        }
        @media (max-width: 900px) {
          .tv-grid { grid-template-columns: 1fr; }
        }

        .tv-panel {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px;
        }

        .tv-eyebrow {
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 10px;
        }

        .tv-dropzone {
          border: 1.5px dashed var(--border);
          border-radius: 8px;
          padding: 18px 12px;
          text-align: center;
          cursor: pointer;
          transition: border-color 0.15s ease, background 0.15s ease;
        }
        .tv-dropzone:hover, .tv-dropzone.drag {
          border-color: var(--accent);
          background: var(--accent-dim);
        }
        .tv-dropzone svg { margin: 0 auto 6px; display: block; color: var(--text-dim); }
        .tv-dropzone p { font-size: 12px; color: var(--text-dim); margin: 0; }
        .tv-dropzone .fname { color: var(--text); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

        .tv-btn {
          font-family: var(--mono);
          font-size: 11.5px;
          letter-spacing: 0.02em;
          background: transparent;
          border: 1px solid var(--border);
          color: var(--text);
          padding: 8px 10px;
          border-radius: 6px;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          width: 100%;
          justify-content: center;
          margin-top: 8px;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tv-btn.primary { border-color: var(--accent); color: var(--accent); }

        .tv-confirm-panel {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          justify-content: center;
          min-height: 360px;
          gap: 4px;
        }
        .tv-confirm-text {
          max-width: 420px;
          font-size: 13.5px;
          line-height: 1.6;
          color: var(--text);
          margin: 10px 0 4px;
        }
        .tv-confirm-actions { width: 100%; max-width: 240px; }
        .tv-confirm-actions .tv-btn { margin-top: 10px; }
        .tv-confirm-hint {
          font-size: 11px;
          color: var(--text-dim);
          margin-top: 10px;
        }

        .tv-field { margin-top: 12px; }
        .tv-field label {
          display: block;
          font-family: var(--mono);
          font-size: 10.5px;
          color: var(--text-dim);
          margin-bottom: 4px;
          letter-spacing: 0.04em;
        }
        .tv-field select, .tv-field input[type="number"] {
          width: 100%;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text);
          font-family: var(--mono);
          font-size: 12.5px;
          padding: 7px 8px;
          border-radius: 6px;
        }
        .tv-field select:focus, .tv-field input:focus {
          outline: 2px solid var(--accent);
          outline-offset: 1px;
        }

        .tv-refbtns { display: flex; gap: 6px; margin-top: 6px; }
        .tv-refbtns button {
          flex: 1;
          font-family: var(--mono);
          font-size: 10.5px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          padding: 5px 4px;
          border-radius: 5px;
          cursor: pointer;
        }
        .tv-refbtns button:hover { color: var(--accent); border-color: var(--accent); }

        .tv-codes {
          margin-top: 8px;
          max-height: 140px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .tv-code-row {
          display: flex;
          align-items: center;
          gap: 6px;
          font-family: var(--mono);
          font-size: 11px;
          color: var(--text-dim);
        }
        .tv-code-row input { accent-color: var(--accent); }

        .tv-viz-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
          flex-wrap: wrap;
        }
        .tv-viz-controls {
          display: flex;
          align-items: center;
          gap: 6px;
          flex-wrap: wrap;
        }
        .tv-symbology-select {
          font-family: var(--mono);
          font-size: 10.5px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text);
          padding: 6px 7px;
          border-radius: 7px;
          cursor: pointer;
        }
        .tv-viewtoggle {
          display: flex;
          gap: 4px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 7px;
          padding: 3px;
        }
        .tv-viewtoggle button {
          display: flex;
          align-items: center;
          gap: 5px;
          background: transparent;
          border: none;
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.03em;
          padding: 5px 9px;
          border-radius: 5px;
          cursor: pointer;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .tv-viewtoggle button:hover { color: var(--text); }
        .tv-viewtoggle button.active { background: var(--accent-dim); color: var(--accent); }

        .tv-view-actions { display: flex; gap: 6px; }
        .tv-view-actions button {
          display: flex;
          align-items: center;
          gap: 5px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 10px;
          letter-spacing: 0.02em;
          padding: 5px 8px;
          border-radius: 6px;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-view-actions button:hover { color: var(--accent); border-color: var(--accent); }

        .tv-pannable { cursor: grab; touch-action: none; }
        .tv-pannable:active { cursor: grabbing; }
        .tv-pan-hint {
          font-size: 10px;
          color: var(--text-dim);
          text-align: center;
          margin-top: -2px;
        }

        .tv-viz-wrap { display: flex; flex-direction: column; gap: 10px; }
        .tv-svg-frame {
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 10px;
          overflow: hidden;
        }
        .tv-svg-frame svg { display: block; width: 100%; height: auto; }
        .tv-svg-empty {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 420px;
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 12.5px;
          text-align: center;
          padding: 20px;
        }

        .tv-caption {
          display: flex;
          justify-content: space-between;
          font-family: var(--mono);
          font-size: 10.5px;
          color: var(--text-dim);
        }

        .tv-legend { position: relative; padding-top: 6px; }
        .tv-legend-bar { height: 8px; border-radius: 4px; }
        .tv-legend-labels {
          display: flex;
          justify-content: space-between;
          font-family: var(--mono);
          font-size: 10px;
          color: var(--text-dim);
          margin-top: 4px;
        }
        .tv-legend-tick {
          position: absolute;
          top: 0;
          transform: translateX(-50%);
        }
        .tv-legend-tick .line {
          width: 2px;
          height: 14px;
          background: var(--text);
          margin: 0 auto;
        }
        .tv-legend-tick span {
          display: block;
          font-family: var(--mono);
          font-size: 9.5px;
          color: var(--text);
          white-space: nowrap;
          margin-top: 2px;
        }

        .tv-results-title {
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 12px;
        }

        .tv-extents {
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 8px 10px;
          margin-bottom: 12px;
          font-size: 10.5px;
          color: var(--text-dim);
          line-height: 1.6;
        }
        .tv-extents .row span.k { color: var(--text); font-weight: 600; }

        .tv-stat {
          display: flex;
          flex-direction: column;
          padding: 8px 0;
          border-bottom: 1px solid var(--border);
        }
        .tv-stat:last-of-type { border-bottom: none; }
        .tv-stat .k {
          font-size: 10.5px;
          color: var(--text-dim);
          letter-spacing: 0.02em;
        }
        .tv-stat .v {
          font-family: var(--mono);
          font-size: 17px;
          margin-top: 2px;
        }
        .tv-stat .v .unit { font-size: 11px; color: var(--text-dim); margin-left: 4px; }
        .tv-stat.hero .v { color: var(--accent); font-size: 21px; }

        .tv-note {
          margin-top: 14px;
          padding: 10px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 8px;
          font-size: 11px;
          line-height: 1.5;
          color: var(--text-dim);
          display: flex;
          gap: 8px;
        }
        .tv-note svg { flex-shrink: 0; margin-top: 1px; color: var(--accent); }

        .tv-footer {
          margin-top: 18px;
          padding-top: 14px;
          border-top: 1px solid var(--border);
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.03em;
          color: var(--text-dim);
          text-align: center;
          line-height: 1.7;
        }
        .tv-disclaimer {
          font-size: 10px;
          color: var(--text-dim);
          opacity: 0.8;
        }

        .tv-error {
          margin-top: 10px;
          font-size: 11.5px;
          color: #f0a06a;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .tv-skip {
          margin-top: 8px;
          font-size: 10.5px;
          color: var(--text-dim);
        }

        .tv-modal-backdrop {
          position: absolute;
          inset: 0;
          background: rgba(0,0,0,0.62);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 50;
          border-radius: 14px;
          padding: 20px;
        }
        .tv-modal-box {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 20px;
          max-width: 480px;
          width: 100%;
          max-height: 90%;
          overflow-y: auto;
        }
        .tv-modal-box.wide { max-width: 96%; width: 96%; }
        .tv-modal-title {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 12px;
        }
        .tv-modal-title h3 {
          font-family: var(--mono);
          font-size: 13px;
