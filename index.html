        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        .tv-root {
          --bg: #0b1622;
          --panel: #10202e;
          --panel-2: #0d1c29;
          --border: #21374a;
          --grid-line: rgba(255,255,255,0.05);
          --text: #e7ecf2;
          --text-dim: #8ea1b4;
          --accent: #e8722c;
          --accent-dim: rgba(232,114,44,0.16);
          --mono: 'IBM Plex Mono', ui-monospace, monospace;
          --sans: 'Space Grotesk', ui-sans-serif, sans-serif;

          background: var(--bg);
          color: var(--text);
          font-family: var(--sans);
          border-radius: 14px;
          padding: 22px;
          width: 100%;
          box-sizing: border-box;
        }
        .tv-root * { box-sizing: border-box; }

        .tv-header {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 16px;
          padding-bottom: 16px;
          margin-bottom: 18px;
          border-bottom: 1px solid var(--border);
          flex-wrap: wrap;
        }
        .tv-wordmark {
          font-family: var(--mono);
          font-size: 22px;
          letter-spacing: 0.02em;
          font-weight: 600;
        }
        .tv-wordmark span { color: var(--accent); }
        .tv-tagline {
          font-size: 12.5px;
          color: var(--text-dim);
          max-width: 420px;
          line-height: 1.5;
        }

        .tv-grid {
          display: grid;
          grid-template-columns: 260px 1fr 260px;
          gap: 16px;
          align-items: start;
        }
        @media (max-width: 900px) {
          .tv-grid { grid-template-columns: 1fr; }
        }

        .tv-panel {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px;
        }

        .tv-eyebrow {
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 10px;
        }

        .tv-dropzone {
          border: 1.5px dashed var(--border);
          border-radius: 8px;
          padding: 18px 12px;
          text-align: center;
          cursor: pointer;
          transition: border-color 0.15s ease, background 0.15s ease;
        }
        .tv-dropzone:hover, .tv-dropzone.drag {
          border-color: var(--accent);
          background: var(--accent-dim);
        }
        .tv-dropzone svg { margin: 0 auto 6px; display: block; color: var(--text-dim); }
        .tv-dropzone p { font-size: 12px; color: var(--text-dim); margin: 0; }
        .tv-dropzone .fname { color: var(--text); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

        .tv-btn {
          font-family: var(--mono);
          font-size: 11.5px;
          letter-spacing: 0.02em;
          background: transparent;
          border: 1px solid var(--border);
          color: var(--text);
          padding: 8px 10px;
          border-radius: 6px;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          width: 100%;
          justify-content: center;
          margin-top: 8px;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tv-btn.primary { border-color: var(--accent); color: var(--accent); }

        .tv-field { margin-top: 12px; }
        .tv-field label {
          display: block;
          font-family: var(--mono);
          font-size: 10.5px;
          color: var(--text-dim);
          margin-bottom: 4px;
          letter-spacing: 0.04em;
        }
        .tv-field select, .tv-field input[type="number"] {
          width: 100%;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text);
          font-family: var(--mono);
          font-size: 12.5px;
          padding: 7px 8px;
          border-radius: 6px;
        }
        .tv-field select:focus, .tv-field input:focus {
          outline: 2px solid var(--accent);
          outline-offset: 1px;
        }

        .tv-refbtns { display: flex; gap: 6px; margin-top: 6px; }
        .tv-refbtns button {
          flex: 1;
          font-family: var(--mono);
          font-size: 10.5px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          padding: 5px 4px;
          border-radius: 5px;
          cursor: pointer;
        }
        .tv-refbtns button:hover { color: var(--accent); border-color: var(--accent); }

        .tv-codes {
          margin-top: 8px;
          max-height: 140px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .tv-code-row {
          display: flex;
          align-items: center;
          gap: 6px;
          font-family: var(--mono);
          font-size: 11px;
          color: var(--text-dim);
        }
        .tv-code-row input { accent-color: var(--accent); }

        .tv-viz-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 10px;
        }
        .tv-viewtoggle {
          display: flex;
          gap: 4px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 7px;
          padding: 3px;
        }
        .tv-viewtoggle button {
          display: flex;
          align-items: center;
          gap: 5px;
          background: transparent;
          border: none;
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.03em;
          padding: 5px 9px;
          border-radius: 5px;
          cursor: pointer;
          transition: background 0.15s ease, color 0.15s ease;
        }
        .tv-viewtoggle button:hover { color: var(--text); }
        .tv-viewtoggle button.active { background: var(--accent-dim); color: var(--accent); }

        .tv-viz-wrap { display: flex; flex-direction: column; gap: 10px; }
        .tv-svg-frame {
          background: var(--panel-2);
          border: 1px solid var(--border);
          border-radius: 10px;
          overflow: hidden;
        }
        .tv-svg-frame svg { display: block; width: 100%; height: auto; }
        .tv-svg-empty {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 420px;
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 12.5px;
          text-align: center;
          padding: 20px;
        }

        .tv-caption {
          display: flex;
          justify-content: space-between;
          font-family: var(--mono);
          font-size: 10.5px;
          color: var(--text-dim);
        }

        .tv-legend { position: relative; padding-top: 6px; }
        .tv-legend-bar { height: 8px; border-radius: 4px; }
        .tv-legend-labels {
          display: flex;
          justify-content: space-between;
          font-family: var(--mono);
          font-size: 10px;
          color: var(--text-dim);
          margin-top: 4px;
        }
        .tv-legend-tick {
          position: absolute;
          top: 0;
          transform: translateX(-50%);
        }
        .tv-legend-tick .line {
          width: 2px;
          height: 14px;
          background: var(--text);
          margin: 0 auto;
        }
        .tv-legend-tick span {
          display: block;
          font-family: var(--mono);
          font-size: 9.5px;
          color: var(--text);
          white-space: nowrap;
          margin-top: 2px;
        }

        .tv-results-title {
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 12px;
        }
        .tv-stat {
          display: flex;
          flex-direction: column;
          padding: 8px 0;
          border-bottom: 1px solid var(--border);
        }
        .tv-stat:last-of-type { border-bottom: none; }
        .tv-stat .k {
          font-size: 10.5px;
          color: var(--text-dim);
          letter-spacing: 0.02em;
        }
        .tv-stat .v {
          font-family: var(--mono);
          font-size: 17px;
          margin-top: 2px;
        }
        .tv-stat .v .unit { font-size: 11px; color: var(--text-dim); margin-left: 4px; }
        .tv-stat.hero .v { color: var(--accent); font-size: 21px; }

        .tv-note {
