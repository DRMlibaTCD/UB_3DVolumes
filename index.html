<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerraVol &mdash; Surface Volume Calculator</title>
<meta name="description" content="Free, browser-based surface volume calculator for earthworks and site surveys from surveyed XYZ data, CSV, text, or LandXML. Step-by-step TIN, DTM (with contours), and volume pipeline with exact plane-clipped cut/fill volumes. Constrained Delaunay triangulation, pannable/rotatable plan and 3D views, elevation and cut/fill symbologies, dark/light mode. For engineering and science students and anyone else who needs it. By Mlibatisi Dlamini, BSc Geomatics Engineering, University of Botswana." />
<style>
  html, body { margin: 0; padding: 0; background: #0b1622; min-height: 100vh; }
  #root { max-width: 1400px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
</style>
</head>

        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        .tv-root {
          --mono: 'IBM Plex Mono', ui-monospace, monospace;
          --sans: 'Space Grotesk', ui-sans-serif, sans-serif;

          position: relative;
          background: var(--bg);
          color: var(--text);
          font-family: var(--sans);
          border-radius: 14px;
          padding: 22px;
          width: 100%;
          box-sizing: border-box;
          transition: background 0.2s ease, color 0.2s ease;
        }
        .tv-root * { box-sizing: border-box; }

          display: flex;
          align-items: flex-start;
          justify-content: space-between;

          padding-bottom: 16px;

          border-bottom: 1px solid var(--border);
          flex-wrap: wrap;
        }
        .tv-header-actions {
          display: flex;
          gap: 6px;
          flex-shrink: 0;
        }
        .tv-icon-btn {

          border: 1px solid var(--border);
          color: var(--text-dim);
          width: 32px;
          height: 32px;
          border-radius: 7px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-icon-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tv-about-btn {
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.03em;
          padding: 0 12px;
          height: 32px;
          border-radius: 16px;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-about-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tv-flamingo-btn span { font-size: 16px; line-height: 1; filter: grayscale(0.15); transition: transform 0.15s ease; }
        .tv-flamingo-btn:hover span { transform: scale(1.15) rotate(-6deg); }
        .tv-flamingo-hint {
          margin: 10px 0 0;
          font-size: 11px;
          color: var(--text-dim);
        }
        .tv-theme-toggle {
          display: flex;
          align-items: center;
          gap: 6px;
          background: var(--accent-dim);

          color: var(--accent);
