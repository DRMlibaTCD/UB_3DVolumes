<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerraVol &mdash; Surface Volume Calculator</title>
<meta name="description" content="Free, browser-based surface volume calculator for earthworks and site surveys. Built-in QA/QC checks, an explainable step-by-step calculation walkthrough, and a step-by-step TIN, DTM (with adjustable contours), and volume pipeline with exact plane-clipped cut/fill volumes. Merge multiple survey files (e.g. total station + GPS), CSV/text/LandXML import, pannable/rotatable plan and 3D views, elevation and cut/fill symbologies, dark/light mode. For engineering and science students and anyone else who needs it. By Mlibatisi Dlamini, BSc Geomatics Engineering, University of Botswana." />
<style>
  html, body { margin: 0; padding: 0; background: #0b1622; min-height: 100vh; }
  #root { max-width: 1400px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
</style>
</head>

        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

        .tv-root {
          --mono: 'IBM Plex Mono', ui-monospace, monospace;
          --sans: 'Space Grotesk', ui-sans-serif, sans-serif;

          position: relative;
          background: var(--bg);
          color: var(--text);
          font-family: var(--sans);
          border-radius: 14px;
          padding: 22px;
          width: 100%;
          box-sizing: border-box;
          transition: background 0.2s ease, color 0.2s ease;
        }
        .tv-root * { box-sizing: border-box; }

        .tv-header {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 16px;
          padding-bottom: 16px;
          margin-bottom: 18px;
          border-bottom: 1px solid var(--border);
          flex-wrap: wrap;
        }
        .tv-header-actions {
          display: flex;
          gap: 6px;
          flex-shrink: 0;
        }
        .tv-icon-btn {
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          width: 32px;
          height: 32px;
          border-radius: 7px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-icon-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tv-about-btn {
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.03em;
          padding: 0 12px;
          height: 32px;
          border-radius: 16px;
          cursor: pointer;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-about-btn:hover { color: var(--accent); border-color: var(--accent); }
        .tv-flamingo-btn span { font-size: 16px; line-height: 1; filter: grayscale(0.15); transition: transform 0.15s ease; }
        .tv-flamingo-btn:hover span { transform: scale(1.15) rotate(-6deg); }
        .tv-flamingo-hint {
          margin: 10px 0 0;
          font-size: 11px;
          color: var(--text-dim);
        }
        .tv-theme-toggle {
          display: flex;
          align-items: center;
          gap: 6px;
          background: var(--accent-dim);
          border: 1px solid var(--accent);
          color: var(--accent);
          font-family: var(--mono);
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 0.02em;
          padding: 0 12px;
          height: 32px;
          border-radius: 16px;
          cursor: pointer;
          transition: filter 0.15s ease;
        }
        .tv-theme-toggle:hover { filter: brightness(1.1); }
        .tv-wordmark {
          font-family: var(--mono);
          font-size: 22px;
          letter-spacing: 0.02em;
          font-weight: 600;
        }
        .tv-wordmark span { color: var(--accent); }
        .tv-byline {
          font-family: var(--mono);
          font-size: 11px;
          letter-spacing: 0.04em;
          color: var(--text-dim);
          margin-top: 2px;
        }
        .tv-tagline {
          font-size: 12.5px;
          color: var(--text-dim);
          max-width: 420px;
          line-height: 1.5;
          margin-top: 8px;
        }

        .tv-grid {
          display: grid;
          grid-template-columns: 260px 1fr 260px;
          gap: 16px;
          align-items: start;
        }
        @media (max-width: 900px) {
          .tv-grid { grid-template-columns: 1fr; }
        }

        .tv-panel {
          background: var(--panel);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 16px;
        }

        .tv-eyebrow {
          font-family: var(--mono);
          font-size: 10.5px;
          letter-spacing: 0.12em;
          color: var(--accent);
          margin-bottom: 10px;
        }

        .tv-dropzone {
          border: 1.5px dashed var(--border);
          border-radius: 8px;
          padding: 18px 12px;
          text-align: center;
          cursor: pointer;
          transition: border-color 0.15s ease, background 0.15s ease;
        }
        .tv-dropzone:hover, .tv-dropzone.drag {
          border-color: var(--accent);
          background: var(--accent-dim);
        }
        .tv-dropzone svg { margin: 0 auto 6px; display: block; color: var(--text-dim); }
        .tv-dropzone p { font-size: 12px; color: var(--text-dim); margin: 0; }
        .tv-dropzone .fname { color: var(--text); font-family: var(--mono); font-size: 11.5px; word-break: break-all; }

        .tv-btn {
          font-family: var(--mono);
          font-size: 11.5px;
          letter-spacing: 0.02em;
          background: transparent;
          border: 1px solid var(--border);
          color: var(--text);
          padding: 8px 10px;
          border-radius: 6px;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 6px;
          width: 100%;
          justify-content: center;
          margin-top: 8px;
          transition: border-color 0.15s ease, color 0.15s ease;
        }
        .tv-btn:hover { border-color: var(--accent); color: var(--accent); }
        .tv-btn.primary { border-color: var(--accent); color: var(--accent); }

        .tv-confirm-panel {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          justify-content: center;
          min-height: 360px;
          gap: 4px;
        }
        .tv-confirm-text {
          max-width: 420px;
          font-size: 13.5px;
          line-height: 1.6;
          color: var(--text);
          margin: 10px 0 4px;
        }
        .tv-confirm-actions { width: 100%; max-width: 240px; }
        .tv-confirm-actions .tv-btn { margin-top: 10px; }
        .tv-confirm-hint {
          font-size: 11px;
          color: var(--text-dim);
          margin-top: 10px;
        }

        .tv-field { margin-top: 12px; }
        .tv-field label {
          display: block;
          font-family: var(--mono);
          font-size: 10.5px;
          color: var(--text-dim);
          margin-bottom: 4px;
          letter-spacing: 0.04em;
        }
        .tv-field select, .tv-field input[type="number"] {
          width: 100%;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text);
          font-family: var(--mono);
          font-size: 12.5px;
          padding: 7px 8px;
          border-radius: 6px;
        }
        .tv-field select:focus, .tv-field input:focus {
          outline: 2px solid var(--accent);
          outline-offset: 1px;
        }

        .tv-refbtns { display: flex; gap: 6px; margin-top: 6px; }
        .tv-refbtns button {
          flex: 1;
          font-family: var(--mono);
          font-size: 10.5px;
          background: var(--panel-2);
          border: 1px solid var(--border);
          color: var(--text-dim);
          padding: 5px 4px;
          border-radius: 5px;
          cursor: pointer;
        }
        .tv-refbtns button:hover { color: var(--accent); border-color: var(--accent); }

        .tv-codes {
          margin-top: 8px;
          max-height: 140px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .tv-code-row {
          display: flex;
          align-items: center;
          gap: 6px;
          font-family: var(--mono);
          font-size: 11px;
          color: var(--text-dim);
        }
        .tv-code-row input { accent-color: var(--accent); }

        .tv-qa-panel {
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 12px;
          overflow: hidden;
